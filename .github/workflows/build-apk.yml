name: Build Punch the Clown APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Materialize M2 Beta artwork and test signing key
        run: |
          rm -f app/src/main/res/drawable-nodpi/clowns_01_10.webp
          rm -f app/src/main/res/drawable-nodpi/clown_illustrated_*.jpg
          rm -f app/src/main/res/drawable-nodpi/clown_illustrated_*.webp
          base64 -d build-assets/m2_beta_art_resources.zip.b64 > /tmp/m2_beta_art_resources.zip
          unzip -o /tmp/m2_beta_art_resources.zip -d app/src/main/res/drawable-nodpi
          cat build-assets/game_select_screen_0214.b64.part* | base64 -d > app/src/main/res/drawable-nodpi/game_select_screen.webp
          cat build-assets/rabid_studios_splash_512.webp.b64.part* | base64 -d > app/src/main/res/drawable-nodpi/rabid_studios_splash.webp
          cat build-assets/punch_ornate_frame.webp.b64.part* | base64 -d > app/src/main/res/drawable-nodpi/punch_ornate_frame.webp
          echo "cbf85b776a121c02b87126111f120211785cd8225ac335361ecb5486a035b78a  app/src/main/res/drawable-nodpi/punch_ornate_frame.webp" | sha256sum -c -
          base64 -d build-assets/punch-the-clown-ci-debug.keystore.b64 > build-assets/punch-the-clown-ci-debug.keystore
          for n in $(seq -w 1 10); do
            test -f "app/src/main/res/drawable-nodpi/clown_illustrated_${n}.webp"
          done
          test -f app/src/main/res/drawable-nodpi/punch_clown_splash.webp
          test -f app/src/main/res/drawable-nodpi/rabid_studios_splash.webp
          echo "f2e9e9bc00f2158cd67d39b77beebda8324f99fa3b80c1623910c0a127877428  app/src/main/res/drawable-nodpi/rabid_studios_splash.webp" | sha256sum -c -
          test -f app/src/main/res/drawable-nodpi/punch_clown_icon.webp
          test -f app/src/main/res/drawable-nodpi/game_select_screen.webp
          test -f app/src/main/res/drawable-nodpi/carnival_background.webp
          test -f app/src/main/res/drawable-nodpi/punch_clown_marquee.webp
          test -f app/src/main/res/drawable-nodpi/wood_sign_buttons.webp
          test -f app/src/main/res/raw/wood_sign_no_posts_patch.b64
          echo "87088bddd5e50c9f7011f8ae3a3f9bb3b9dcf4d37dabee8a7e3c71ffb09d4f54  app/src/main/res/raw/wood_sign_no_posts_patch.b64" | sha256sum -c -
          echo "8f5b6cbe82003b43e8a9c4a6852e8705c5e14804f3e612fddf9c70ae439ed95d  app/src/main/res/drawable-nodpi/carnival_background.webp" | sha256sum -c -
          echo "9c5e499fc8ea4dc92a807361fb93153207672d177e19bbac4bd4a93e66b9cca1  app/src/main/res/drawable-nodpi/punch_clown_marquee.webp" | sha256sum -c -
          echo "f5000480951367854aa1178cded65c173187d66e103953de6276ca1d6cca8680  app/src/main/res/drawable-nodpi/wood_sign_buttons.webp" | sha256sum -c -
          echo "a4e3ad8848324b8418ff3096633d6a9c24a61c7dcb59c9dad76dcf980044feed  app/src/main/res/drawable-nodpi/game_select_screen.webp" | sha256sum -c -
          test -f build-assets/punch-the-clown-ci-debug.keystore
          base64 -d build-assets/m3_beaning_resources.zip.b64 > /tmp/m3_beaning_resources.zip
          echo "758c2e1724d6cbe0a2c8386ad5ff94f38092879fa519e20a1313758ae290bc6f  /tmp/m3_beaning_resources.zip" | sha256sum -c -
          unzip -o /tmp/m3_beaning_resources.zip -d app/src/main/res
          base64 -d build-assets/m3_beaning_targets_06_40_compact.zip.b64 > /tmp/m3_beaning_targets_06_40_compact.zip
          echo "de6b88211ccebbe558d52c71e693d63e2f8dc114aa6abb0418b0db499556265f  /tmp/m3_beaning_targets_06_40_compact.zip" | sha256sum -c -
          unzip -o /tmp/m3_beaning_targets_06_40_compact.zip -d app/src/main/res
          test "$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name 'beaning_target_*.webp' | wc -l)" -eq 40
          test -f app/src/main/res/drawable-nodpi/beaning_target_39_firefly.webp
          test -f app/src/main/res/drawable-nodpi/beaning_board.webp
          test -f app/src/main/res/drawable-nodpi/beaning_target_00_bubbles.webp
          test -f app/src/main/res/drawable-nodpi/beaning_target_01_noodles.webp
          test -f app/src/main/res/drawable-nodpi/beaning_target_02_sparky.webp
          test -f app/src/main/res/drawable-nodpi/beaning_target_03_patches.webp
          test -f app/src/main/res/drawable-nodpi/beaning_target_04_giggles.webp
          test -f app/src/main/res/raw/bean_hit_mitt.ogg
          test -f app/src/main/res/raw/bean_miss_whiff.ogg
          test -f app/src/main/res/raw/bean_game_over_buzzer.ogg
          echo "78a3ba59f204ab19df9e9b8e574d84ca28b0473a98ba0385c239eabb5e18fd94  app/src/main/res/drawable-nodpi/beaning_board.webp" | sha256sum -c -
          echo "22969603b9e431774d0d31daf020b0601981ffed9e3312dbcc1601134e16b6b4  app/src/main/res/drawable-nodpi/beaning_target_00_bubbles.webp" | sha256sum -c -
          echo "1467f0312921cb65bbbc05f5b0d985abc28bd8f66b0c7531feb678704d0f4e11  app/src/main/res/drawable-nodpi/beaning_target_01_noodles.webp" | sha256sum -c -
          echo "f5c3431fd831a4a472c437bf504ca631b682c47660c586d965c8eae5078dcbcd  app/src/main/res/drawable-nodpi/beaning_target_02_sparky.webp" | sha256sum -c -
          echo "db1b3ded58f829a3bacf85f6112fbcf0ea909f4b9f7b9cf2f08615fed7dc60dc  app/src/main/res/drawable-nodpi/beaning_target_03_patches.webp" | sha256sum -c -
          echo "852a73e9d725619a04c1c9a5df26a33aa8a0f1f763d735d74285bdaef13e2d34  app/src/main/res/drawable-nodpi/beaning_target_04_giggles.webp" | sha256sum -c -
          echo "c11f57b2216a7374adcd5688fa7a5c44758f82d3c7fe7b9ce4a90b97ac30b49a  app/src/main/res/drawable-nodpi/beaning_sign_step_right_up.webp" | sha256sum -c -
          echo "f0ec8b7b097fd2a0a9ecec52ff0192c5a5c0f69343e4bde9a6780bdb5490c894  app/src/main/res/drawable-nodpi/beaning_sign_bean_again.webp" | sha256sum -c -
          echo "8e4755bacdb7171da7f82355210d41351f1fc17d9eaf867f583dd3cb32855150  app/src/main/res/drawable-nodpi/beaning_sign_back_to_game_select.webp" | sha256sum -c -
          echo "aad7fd9a88d6ca15e637d6b3386a6612bcdaf93651e31138c86e877c8c3b8833  app/src/main/res/drawable-nodpi/beaning_sign_instructions.webp" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install audio tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Materialize one-octave-lower Punch board sounds
        run: bash scripts/lower-punch-grid-sounds.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          for n in $(seq -w 1 10); do
            unzip -l "$APK" | grep -q "clown_illustrated_${n}.webp"
          done
          unzip -l "$APK" | grep -q "punch_clown_splash.webp"
          unzip -l "$APK" | grep -q "rabid_studios_splash.webp"
          unzip -l "$APK" | grep -q "punch_clown_icon.webp"
          unzip -l "$APK" | grep -q "game_select_screen.webp"
          unzip -l "$APK" | grep -q "carnival_background.webp"
          unzip -l "$APK" | grep -q "punch_clown_marquee.webp"
          unzip -l "$APK" | grep -q "punch_ornate_frame.webp"
          unzip -l "$APK" | grep -q "wood_sign_buttons.webp"
          unzip -l "$APK" | grep -q "wood_sign_no_posts_patch.b64"
          unzip -l "$APK" | grep -q "beaning_board.webp"
          unzip -l "$APK" | grep -q "beaning_target_00_bubbles.webp"
          unzip -l "$APK" | grep -q "beaning_target_01_noodles.webp"
          unzip -l "$APK" | grep -q "beaning_target_02_sparky.webp"
          unzip -l "$APK" | grep -q "beaning_target_03_patches.webp"
          unzip -l "$APK" | grep -q "beaning_target_04_giggles.webp"
          test "$(unzip -Z1 "$APK" | grep -c '/beaning_target_.*\.webp$')" -eq 40
          unzip -l "$APK" | grep -q "beaning_target_39_firefly.webp"
          unzip -l "$APK" | grep -q "bean_hit_mitt.ogg"
          unzip -l "$APK" | grep -q "bean_miss_whiff.ogg"
          unzip -l "$APK" | grep -q "bean_game_over_buzzer.ogg"
          for name in \
            grid_01_clown_car.ogg \
            grid_02_freesound_squeak.ogg \
            grid_03_squeak_3.ogg \
            grid_04_squeak_2.ogg \
            grid_05_squeak_1.ogg \
            grid_06_baby_1.ogg \
            grid_07_baby_2.ogg \
            grid_08_tiny_1.ogg \
            grid_09_baby_4.ogg
          do
            packaged="$(unzip -Z1 "$APK" | grep "/${name}$" | head -n 1)"
            test -n "$packaged"
            unzip -p "$APK" "$packaged" > "/tmp/$name"
            expected="$(sha256sum "app/src/main/res/raw/$name" | awk '{print $1}')"
            actual="$(sha256sum "/tmp/$name" | awk '{print $1}')"
            test "$actual" = "$expected"
          done
          unzip -l "$APK" | grep -q "beaning_sign_step_right_up.webp"
          unzip -l "$APK" | grep -q "beaning_sign_bean_again.webp"
          unzip -l "$APK" | grep -q "beaning_sign_back_to_game_select.webp"
          unzip -l "$APK" | grep -q "beaning_sign_instructions.webp"
          verify_sign_asset() {
            local name="$1"
            local expected="$2"
            local packaged
            packaged="$(unzip -Z1 "$APK" | grep "/${name}$" | head -n 1)"
            test -n "$packaged"
            unzip -p "$APK" "$packaged" > "/tmp/$name"
            echo "$expected  /tmp/$name" | sha256sum -c -
          }
          verify_sign_asset "beaning_sign_step_right_up.webp" "c11f57b2216a7374adcd5688fa7a5c44758f82d3c7fe7b9ce4a90b97ac30b49a"
          verify_sign_asset "beaning_sign_bean_again.webp" "f0ec8b7b097fd2a0a9ecec52ff0192c5a5c0f69343e4bde9a6780bdb5490c894"
          verify_sign_asset "beaning_sign_back_to_game_select.webp" "8e4755bacdb7171da7f82355210d41351f1fc17d9eaf867f583dd3cb32855150"
          verify_sign_asset "beaning_sign_instructions.webp" "aad7fd9a88d6ca15e637d6b3386a6612bcdaf93651e31138c86e877c8c3b8833"
          verify_sign_asset "rabid_studios_splash.webp" "f2e9e9bc00f2158cd67d39b77beebda8324f99fa3b80c1623910c0a127877428"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q "versionCode='52'.*versionName='0.4.3-m4-alpha'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PunchTheClown-M4-alpha-0.4.3-reference-frame
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
