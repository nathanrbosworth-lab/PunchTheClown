name: Build Punch the Clown APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Materialize M2 Beta artwork
        run: |
          rm -f app/src/main/res/drawable-nodpi/clowns_01_10.webp
          base64 -d build-assets/m2_beta_art_resources.zip.b64 > /tmp/m2_beta_art_resources.zip
          unzip -o /tmp/m2_beta_art_resources.zip -d app/src/main/res/drawable-nodpi
          test -f app/src/main/res/drawable-nodpi/clown_illustrated_01.jpg
          test -f app/src/main/res/drawable-nodpi/clown_illustrated_10.jpg
          test -f app/src/main/res/drawable-nodpi/punch_clown_splash.webp
          test -f app/src/main/res/drawable-nodpi/punch_clown_icon.webp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PunchTheClown-M2-beta-0.2.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
